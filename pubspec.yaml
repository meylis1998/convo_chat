name: convo
description: A fully-featured chat application with Firebase backend.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.3.0
  cloud_firestore: ^6.1.1
  firebase_auth: ^6.1.3
  firebase_storage: ^13.0.5
  firebase_messaging: ^16.1.0

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # DI & Architecture
  get_it: ^9.0.5
  injectable: ^2.6.0
  dartz: ^0.10.1

  # Local Storage
  drift: ^2.23.0
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.28
  flutter_secure_storage: ^10.0.0

  # Navigation
  go_router: ^17.0.1

  # Authentication
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1

  # Media
  image_picker: ^1.1.2
  file_picker: ^10.3.8
  video_compress: ^3.1.3
  cached_network_image: ^3.4.1
  chewie: ^1.12.1
  video_player: ^2.9.2
  photo_view: ^0.15.0

  # Audio
  record: ^6.1.2
  just_audio: ^0.10.5
  audio_waveforms: ^2.0.1

  # UI
  emoji_picker_flutter: ^4.4.0
  flutter_linkify: ^6.0.0
  url_launcher: ^6.3.1
  shimmer: ^3.0.0
  visibility_detector: ^0.4.0+2

  # Notifications
  flutter_local_notifications: ^19.0.0

  # Utilities
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  uuid: ^4.5.1
  intl: ^0.20.2
  timeago: ^3.7.0
  rxdart: ^0.28.0
  connectivity_plus: ^7.0.0
  path_provider: ^2.1.5
  path: ^1.9.0
  mime: ^2.0.0
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  freezed: ^3.0.6
  json_serializable: ^6.9.4
  injectable_generator: ^2.6.2
  drift_dev: ^2.23.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  # assets:
  #   - assets/images/
  #   - assets/icons/
